<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap feladatok</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      .magassag {
        height: 30vh;
      }
    </style>
  </head>
  <body>
    <div class="container magassag border">
      <div class="row">
        <div class="col m-2 border">Column1</div>
        <div class="col m-2 border">Column2</div>
        <div class="col m-2 border">Column3</div>
      </div>
    </div>

    <div class="container magassag bg-info">
      <div class="row">
        <div class="col m-2 bg-primary text-light">Column1</div>
        <div class="col m-2 bg-primary text-light">Column2</div>
        <div class="col m-2 bg-primary text-light">Column3</div>
      </div>
    </div>

    <div class="container magassag border mt-2 overflow-auto">
      <div class="row">
        <div class="col-lg m-2 border">Column1</div>
        <div class="col-lg m-2 border">Column2</div>
        <div class="col-lg m-2 border">Column3</div>
      </div>

      <div class="row m-2 border">
        <div class="col-xl m-2 border">Column1</div>
        <div class="col-xl m-3 border">Column2</div>
        <div class="col-xl m-4 border">Column3</div>
      </div>
    </div>

    <div class="container magassag border bg-secondary mt-2">
      <div class="row bg-danger text-light m-2">
        <div class="col-md-4 m-2 bg-primary">Column1</div>
        <div class="col-md-4 m-2 bg-success">Column2</div>
        <div class="col-md-4 m-2 bg-primary">Column3</div>
      </div>

      <div class="row bg-warning text-dark m-2">
        <div class="col-xl-4 m-2 bg-info">Column1</div>
        <div class="col-xl-4 m-2 bg-success">Column2</div>
        <div class="col-xl-4 m-2 bg-info">Column3</div>
      </div>
    </div>
  </body>
</html>
