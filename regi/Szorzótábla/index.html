<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szorzótábla</title>
</head>
<body>
    <style>
        body{
            margin-top: 25px;
        }
        div{
            text-align: center;
            margin: 0 auto;
            width: 50vw;
            border: 3px solid black;
            border-radius: 10px;
            padding: 20px;
            position: relative;
            border: 1px solid #ccc;
        }
        span{
            font-size: 35px;
        }
        label{
            font-size: 25px;
        }
        input{
            border: 2px solid black;
            border-radius: 5px;
        }
        input:focus{
            outline: 3px solid gray;
        }
        #rating{
            font-size: 25px;
            font-weight: bold;
        }
        button{
            background-color: white;
            color: black;
            outline: 3px solid black;
            width: 120px;
            height: 30px;
            border: none;
            border-radius: 10px;
        }
        button:hover{
            background-color: black;
            color: white;
        }
        #row {
            position: absolute;
            top: 0;
            left: 0;
            padding: 5px;
        }
    </style>
    
    <div>
    <span id="row">0🔥</span>
    <span id="first"></span>
    <span>&nbsp;*&nbsp;</span>
    <span id="second"></span>
    <br>
    <br>
    <button onclick="Generate()">Szám generálása</button>
    <br>
    <br>
    <label for="answer">Válasz:</label>
    <input type="number" id="answer">
    <br>
    <br>
    <button onclick="Check()">Ellenőrzés</button>
    <br>
    <br>
    <span id="rating"></span>
    </div>

    <script>
        const first = document.getElementById("first");
        const second = document.getElementById("second");
        const answer = document.getElementById("answer");
        const rating = document.getElementById("rating");
        const row = document.getElementById("row");
		
        let count = 0;
		let result;
		Generate();
		
		function Generate(){
			rating.textContent = "";
			answer.value = "";
			
			let firstNum = Math.floor(Math.random() * 10);

			let secondNum = Math.floor(Math.random() * 10);

			result = firstNum * secondNum;

			first.textContent = firstNum;
			second.textContent = secondNum;
		}    

        function Check(){
            if(answer.value == ""){
                rating.style.color = "red";
                rating.textContent = "Adja meg a választ!";
            }
            else{
                if(answer.value == result){
                    Generate();
                    count++;
                    row.textContent = `${count}🔥`

                } 
                else{
                    rating.style.color = "red";
                    rating.innerHTML = `A válasz helytelen!<br>A megoldás: ${result}`;
                    count = 0;
                    row.textContent = `${count}🔥`
                }
            }
        }
    </script>
</body>
</html>
