<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Grid Példa</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="row mt-4">
        <div class="d-flex p-3 row">
          <div class="col-xxl-4 text-white bg-primary p-3">1. Column</div>
          <div class="col-md-4 bg-warning text-white p-3">2. Column</div>
          <div class="col-lg-4 bg-secondary text-white p-3">3. Column</div>
        </div>
      </div>

      <div class="d-flex justify-content-center my-5">
        <div class="text-dark bg-light border text-center rounded p-5">
          <h1>Üdvözöllek!</h1>
          <p>Ez egy középre igazított Bootstrap box.</p>
          <button class="btn btn-primary">Kattints ide</button>
        </div>
      </div>

      <div class="row">
        <div class="d-flex mb-4 mt-4 p-3 row">
          <div class="text-white bg-danger col-md-4 p-3">1. Column</div>
          <div class="border bg-light text-dark col-lg-4 p-3">2. Column</div>
          <div class="text-white col-xxl-4 bg-success p-3">3. Column</div>
        </div>
      </div>
    </div>
  </body>
</html>
