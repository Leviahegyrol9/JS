<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Autók</title>
</head>
<body>
    <div class="container">
        <div class="row"></div>

        <form id="carForm" class="mb-4">
        <div class="mb-3">
            <input type="text" id="brand" class="form-control" placeholder="Márka">
        </div>

        <div class="mb-3">
            <input type="text" id="model" class="form-control" placeholder="Model">
        </div>

        <div class="mb-3">
            <input type="number" id="year" class="form-control" placeholder="Évjárat">
        </div>

        <button onclick="createCar()" class="btn btn-success" type="button">Mentés</button>
    </form>
    </div>

    <div id="checkCar">
        <div id="carProperties"></div>
        <button id="topBtn" class="btn btn-dark" onclick="back()">Vissza</button>

        <form id="modifyForm" class="mb-3">
        <div class="mb-3">
            <input type="text" id="newBrand" class="form-control" placeholder="Márka">
        </div>

        <div class="mb-3">
            <input type="text" id="newModel" class="form-control" placeholder="Model">
        </div>

        <div class="mb-3">
            <input type="number" id="newYear" class="form-control" placeholder="Évjárat">
        </div>
    </form>
    </div>
   
    <script src="script.js"></script>
</body>
</html>
