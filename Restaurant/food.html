<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bin/index.css">
    <title></title>
</head>
<body>
    <h1></h1>
    <hr>

    <div id="food"></div>

    <button id="back" class="btn btn-dark" onclick="back()">Vissza</button>

    <form class="mb-3">
            <h4>Módosítás</h4>

            <div class="mb-3">
                <input type="text" id="name" class="form-control" placeholder="Név">
            </div>

            <div class="mb-3">
                <input type="number" id="price" class="form-control" placeholder="Ár">
            </div>

            <div class="mb-3">
                <input type="number" id="weight" class="form-control" placeholder="Tömeg">
            </div>
			
			<button onclick="saveFood()" class="btn btn-success" type="button">Mentés</button>
			<button onclick="deleteFood()" class="btn btn-danger" type="button">Törlés</button>
        </form>

    
    <script src="bin/food.js"></script>
</body>
</html>
