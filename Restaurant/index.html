<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="bin/index.css">
    <title>Étlap</title>
</head>
<body>
    <h1>Étlap</h1>

    <div class="container">
        <div id="search-container">
            <input type="number" placeholder="Írja be az id-t...">
            <button class="btn btn-dark" onclick="search()">Keresés</button>
        </div>
        <br>
        <div class="row"></div>
        <button id="back" class="btn btn-dark" onclick="location.href='#form'">Hozzáadás</button>

        <form id="form" class="mb-3">
            <h4>Hozzáadás</h4>

            <div class="mb-3">
                <input type="text" id="name" class="form-control" placeholder="Név">
            </div>

            <div class="mb-3">
                <input type="number" id="price" class="form-control" placeholder="Ár">
            </div>

            <div class="mb-3">
                <input type="number" id="weight" class="form-control" placeholder="Tömeg">
            </div>
			
			<button onclick="addFood()" class="btn btn-success" type="button">Hozzáadás</button>
        </form>
    </div>

    <script src="bin/index.js"></script>
</body>
</html>
