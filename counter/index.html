<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #result {
        font-size: 30px;
      }

      header {
        background-color: lavender;
        height: 40px;
        width: 100%;
        font-size: 18px;
        text-align: left;
        vertical-align: middle;
        padding-left: 10px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }
      body {
        text-align: center;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      div {
        margin: auto;
        font-size: 18px;
      }
      .addButton {
        background-color: lavender;
        font-size: 20px;
        margin: 15px;
        width: 50px;
        height: 50px;
        border-radius: 15px;
        border: none;
        box-shadow: 5px 10px 5px grey;
      }
      .addTenButton {
        background-color: lavender;
        font-size: 20px;
        margin: 15px;
        width: 50px;
        height: 50px;
        border-radius: 15px;
        border: none;
        margin-top: 10px;
        margin-left: 50px;
        margin-right: 50px;
      }
      button:hover {
        transform: scale(1.2);
        transition: 0.2s ease-in-out;
      }
    </style>
  </head>
  <body>
    <header>Counter</header>
    <div>
      <span>Counter value:</span><br />
      <span id="result">0</span><br />
      <button onclick="minusNumber(1)" class="addButton">-</button>
      <button onclick="addNumber(1)" class="addButton">+</button><br />
      <button onclick="minusNumber(10)" class="addTenButton">-10</button>
      <button onclick="addNumber(10)" class="addTenButton">+10</button>
    </div>
  </body>

  <script>
    const result = document.getElementById("result");

    const addNumber = (number) => {
      result.innerHTML = parseInt(result.innerHTML) + number;
    };
    const minusNumber = (number) => {
      result.innerHTML = parseInt(result.innerHTML) - number;
    };
  </script>
</html>
